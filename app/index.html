<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Tides Cover Studio — GTA-style poster maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Seven Tides</h1>
    <p class="sub">Turn your photos into GTA-style cover art. 7 panels, 8 layouts, 8 grades — export a PNG to share.</p>
    <label>Title <input id="title" type="text" maxlength="24" value="SEVEN TIDES"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="one harbor, seven lives"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="64" value="SEVEN FACES · ONE HARBOR · NO WAY BACK"></label>
    <div class="group" id="layout-group"><span class="group-label">Layout</span><div class="chips" id="layouts"></div></div>
    <div class="group" id="grade-group"><span class="group-label">Grade</span><div class="chips" id="grades"></div></div>
    <div class="group" id="frame-group"><span class="group-label">Frame</span><div class="chips" id="frames"></div></div>
    <div class="sliders">
      <label>Warmth <input id="warmth" type="range" min="0" max="1" step="0.05" value="0.5"></label>
      <label>Saturation <input id="saturation" type="range" min="0" max="1" step="0.05" value="0.5"></label>
      <label>Vignette <input id="vignette" type="range" min="0" max="1" step="0.05" value="0.5"></label>
      <label>Grain <input id="grain" type="range" min="0" max="1" step="0.05" value="0.4"></label>
    </div>
    <div class="group"><span class="group-label">Cast — click a panel to edit it</span><div class="cast" id="cast"></div></div>
    <div class="panel-edit" id="panel-edit">
      <span class="group-label" id="panel-edit-title">Panel 1 · THE DRIVER</span>
      <label>Photo <select id="panel-photo"></select></label>
      <label>Role <input id="panel-role" type="text" maxlength="16"></label>
      <label>Place <input id="panel-place" type="text" maxlength="20"></label>
      <label>Time <input id="panel-time" type="text" maxlength="12"></label>
      <label>Caption <input id="panel-caption" type="text" maxlength="28"></label>
      <label>Zoom <input id="panel-zoom" type="range" min="1" max="2.2" step="0.05" value="1"></label>
      <div class="row">
        <button id="face-focus" type="button">Face focus</button>
        <button id="upload-photo" type="button">Upload photo</button>
        <input id="file-input" type="file" accept="image/*" hidden>
      </div>
    </div>
    <div class="row">
      <button id="autofill" type="button">Auto-fill cast</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
    </div>
    <div class="row export-row">
      <button id="export-1080" type="button">PNG 1080×1080</button>
      <button id="export-1350" type="button">PNG 1080×1350</button>
      <button id="export-1920" type="button">PNG 1920×1080</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover preview"></canvas>
    <p class="hint">Drag a panel to pan its photo · scroll over a panel to zoom · the subtitle always sits clear below the title.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
